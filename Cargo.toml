[package]
authors = ["The Hyperledger Anoncreds Contributors"]
description = "Hyperledger Anoncreds CL Signatures"
documentation = "https://docs.rs/anoncreds-clsignatures"
edition = "2021"
license = "Apache-2.0"
name = "anoncreds-clsignatures"
readme = "README.md"
repository = "https://github.com/anoncreds/anoncreds-clsignatures-rs"
version = "0.3.3"
rust-version = "1.65"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["serde", "openssl_bn"]
openssl_bn = ["openssl"]
openssl_vendored = ["openssl_bn", "openssl/vendored"]
vca = ["dep:credx"]

[dependencies]
amcl = "0.2"
credx = { git = "https://github.com/mark-moir/anoncreds-v2-rs", branch="vca-main", optional = true }
# see https://github.com/anoncreds/anoncreds-clsignatures-rs/issues/102#issuecomment-4830591710
glass_pumpkin = "2.0.0-rc"
log = "0.4"
num-bigint = { version = "0.4", features = ["rand"] }
num-integer = "0.1.45"
num-traits = "0.2.19"
once_cell = "1"
openssl = { version = "0.10", optional = true }
rand = "0.8"
serde = { version = "1", optional = true, features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"
rmp-serde = "1"

[[bench]]
name = "cl"
harness = false

# speed up big numbers and prime generation for tests
[profile.test.package.num-bigint]
opt-level = 3
[profile.test.package.glass_pumpkin]
opt-level = 3
